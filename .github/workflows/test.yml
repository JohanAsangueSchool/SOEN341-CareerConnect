name: Run Tests

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

defaults:
    run:
        working-directory: App

jobs:
    # Lint and build need no credentials, so this job is the gate that always
    # runs on a pull request.
    build:
        name: Lint and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: App/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              # The Supabase values are read at build time by the client
              # components; placeholders are enough to compile.
              env:
                  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
              run: npm run build

    # The acceptance suite drives a real browser against a real Supabase
    # project, so it needs the repository secrets listed in the README of
    # Documentation/Acceptance_Tests_Sprint_2.md. Until those are configured
    # this job fails while `build` still passes.
    acceptance-tests:
        name: Acceptance tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: App/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Downloading the browser takes minutes, so it is cached per
            # Playwright version; the system libraries still install each run.
            - name: Get Playwright version
              id: playwright
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Run acceptance tests
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
                  E2E_WORKER_EMAIL: ${{ secrets.E2E_WORKER_EMAIL }}
                  E2E_WORKER_PASSWORD: ${{ secrets.E2E_WORKER_PASSWORD }}
                  E2E_WORKER_FIRST_NAME: ${{ secrets.E2E_WORKER_FIRST_NAME }}
                  E2E_WORKER_LAST_NAME: ${{ secrets.E2E_WORKER_LAST_NAME }}
                  E2E_RECRUITER_EMAIL: ${{ secrets.E2E_RECRUITER_EMAIL }}
                  E2E_RECRUITER_PASSWORD: ${{ secrets.E2E_RECRUITER_PASSWORD }}
              # The two registration criteria create real users, so they are
              # excluded from CI runs against the shared project.
              run: npm test -- --grep-invert @writes

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: App/playwright-report/
                  retention-days: 7
